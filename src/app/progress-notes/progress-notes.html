<h2>Progress Notes</h2>

<form [formGroup]="progressForm">
    
    <div>
        <label for="project-name">Project Name:</label>
        <input
            id="project-name"
            type="text"
            formControlName="projectName">
    </div>
 
    <div>
        <label for="due-date">Date:</label>
        <input
            id="due-date"
            type="date"
            formControlName="dueDate">
    </div>
    
    <div>
        <label for="current-status">Current Status:</label>
        <input
            id="current-status"
            type="text"
            formControlName="currentStatus">
    </div>
    
    <div>
        <label for="team-member">Team Member:</label>
        <input
            id="team-member"
            type="text"
            formControlName="teamMember">
    </div>
    
    <div>
        <label for="progress-note">Progress Note:</label>
        <input
            id="progress-note"
            type="text"
            [(ngModel)]="progressNote">
    </div>

    <div>
        <label for="project-code">Project Code:</label>
        <input
            id="project-code"
            type="text"
            formControlName="projectCode"
            (blur)="OnProjectCodeBlur()"
            (focus)="clearError()"/>
    </div>
    
<p>Current Note: {{ progressNote }}</p>
<p>Error Message: {{ errorMessage }}</p>
</form>
